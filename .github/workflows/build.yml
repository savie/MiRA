name: MiRA EAS Build

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Debug info
        run: |
          node --version
          npx expo --version
          cat app.json
          ls -la

      - name: Expo config check
        run: npx expo config 2>&1 || true

      - name: Build APK
        run: eas build --platform android --profile preview --non-interactive
